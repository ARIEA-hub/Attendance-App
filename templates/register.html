<!DOCTYPE html>
<html>
<head><title>Register Device</title></head>
<body>
  <h1>Register New Device</h1>
  <form action="/register" method="post">
    <label>MAC:</label>
    <input type="text" name="mac" required><br><br>
    <label>Name:</label>
    <input type="text" name="name" required><br><br>
    <label>Group:</label>
    <input type="text" name="group" required><br><br>
    <button type="submit">Save</button>
  </form>
</body>
</html>
